<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Sfida Sudoku 9x9</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f1f5f9; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; min-height: 100vh; }
    .card { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; max-width: 440px; width: 100%; }
    h2 { margin: 0 0 4px 0; font-size: 19px; color: #0f172a; }
    #team-info { font-size: 14px; color: #64748b; margin-bottom: 6px; }
    #timer { font-size: 26px; font-weight: 700; color: #2563eb; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
    
    /* Griglia Sudoku 9x9 */
    .grid {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 3px solid #0f172a;
      background: #0f172a;
      gap: 1px;
      margin: 0 auto 10px auto;
    }
    .cell {
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      color: #2563eb;
      cursor: pointer;
      user-select: none;
      position: relative;
    }
    /* Bordi rinforzati per i blocchi 3x3 */
    .cell:nth-child(3n) { border-right: 2px solid #0f172a; }
    .cell:nth-child(9n) { border-right: none; }
    .cell:nth-child(n+19):nth-child(-n+27),
    .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid #0f172a; }

    .cell.fixed { background: #e2e8f0; color: #0f172a; font-weight: 800; cursor: default; }
    .cell.related { background: #f8fafc; }
    .cell.selected { background: #bfdbfe !important; }

    /* Mini-griglia 3x3 per le note a matita */
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      width: 100%;
      height: 100%;
      padding: 1px;
      pointer-events: none;
    }
    .note-num {
      font-size: 9px;
      line-height: 1;
      font-weight: 600;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Barra strumenti (Matita) */
    .tools {
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }
    .tool-btn {
      padding: 7px 16px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 20px;
      border: 2px solid #cbd5e1;
      background: #f8fafc;
      color: #475569;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tool-btn.active {
      background: #fef3c7;
      border-color: #f59e0b;
      color: #b45309;
    }
    
    /* Tastiera numerica a video */
    .keypad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 12px; }
    .key { padding: 10px 0; font-size: 18px; font-weight: bold; background: #e2e8f0; border: none; border-radius: 6px; cursor: pointer; color: #0f172a; }
    .key:active { background: #cbd5e1; }
    .key.pencil-mode { background: #fef3c7; color: #92400e; }
    .key-del { background: #fee2e2; color: #b91c1c; }

    button#submit-btn {
      background: #2563eb; color: white; border: none; padding: 12px; font-size: 16px; font-weight: 700; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s;
    }
    button#submit-btn:disabled { background: #94a3b8; cursor: not-allowed; }
    #msg { margin-top: 10px; font-size: 14px; font-weight: 600; }
  </style>
</head>
<body>

  <div class="card">
    <h2 id="player-title">Sudoku 9x9</h2>
    <div id="team-info"></div>
    <div id="timer">00:00</div>
    <div class="grid" id="board"></div>

    <div class="tools">
      <button id="pencil-btn" class="tool-btn" onclick="togglePencil()">✏️ Matita: OFF</button>
    </div>

    <div class="keypad" id="keypad">
      <button class="key num-key" onclick="insertDigit(1)">1</button>
      <button class="key num-key" onclick="insertDigit(2)">2</button>
      <button class="key num-key" onclick="insertDigit(3)">3</button>
      <button class="key num-key" onclick="insertDigit(4)">4</button>
      <button class="key num-key" onclick="insertDigit(5)">5</button>
      <button class="key num-key" onclick="insertDigit(6)">6</button>
      <button class="key num-key" onclick="insertDigit(7)">7</button>
      <button class="key num-key" onclick="insertDigit(8)">8</button>
      <button class="key num-key" onclick="insertDigit(9)">9</button>
      <button class="key key-del" onclick="insertDigit('')">⌫</button>
    </div>

    <button id="submit-btn" onclick="checkWin()">Invia Soluzione</button>
    <div id="msg"></div>
  </div>

<script>
// --- URL DI APPS SCRIPT ---
const SCRIPT_URL = "https://script.google.com/a/macros/hknpolito.org/s/AKfycbyNd2DW5ZdiAWixGEQUEjZ7Txlg3sT5IBcte5uO9rHiFoNXvOTFwqRgALGDOhnDADAuSg/exec";

// 5 Schemi 9x9 semplificati (45 numeri dati, soluzione unica)
const schemi = {
  "1": {
    puzzle: "500678900672095048000340567859060023026003701703900800900000200080010605345280079",
    sol:    "534678912672195348198342567859761423426853791713924856961537284287419635345286179"
  },
  "2": {
    puzzle: "000080076100073580007004010976025038010098000082700901301607840028349065604802093",
    sol:    "245981376169273584837564219976125438513498627482736951391657842728349165654812793"
  },
  "3": {
    puzzle: "405000081080571090097004060820100347004602905050740600000020804248957136003410250",
    sol:    "435269781682571493197834562826195347374682915951743628519326874248957136763418259"
  },
  "4": {
    puzzle: "100489370030250801000001295087120059000003020200800710914607500025048130800510964",
    sol:    "152489376739256841468371295387124659591763428246895713914637582625948137873512964"
  },
  "5": {
    puzzle: "100078905080030760967045008072461580600583200000792603006004100210800430745000802",
    sol:    "123678945584239761967145328372461589691583274458792613836924157219857436745316892"
  }
};

const params = new URLSearchParams(window.location.search);
const idSchema = params.get("schema") || "1";
const nome = params.get("nome") || "Giocatore";
const cognome = params.get("cognome") || "";
const squadra = params.get("squadra") || "Nessuna";

document.getElementById("player-title").innerText = `${nome} ${cognome}`;
document.getElementById("team-info").innerText = `Squadra: ${squadra} • Schema #${idSchema}`;

const puzzleData = schemi[idSchema] || schemi["1"];
const board = document.getElementById("board");
let selectedIdx = -1;
let pencilMode = false;
let userValues = new Array(81).fill("");
let cellNotes = Array.from({ length: 81 }, () => new Set());

// Creazione caselle
for (let i = 0; i < 81; i++) {
  const cell = document.createElement("div");
  cell.classList.add("cell");
  const val = puzzleData.puzzle[i];
  
  if (val !== "0") {
    cell.innerText = val;
    cell.classList.add("fixed");
    userValues[i] = val;
  } else {
    cell.addEventListener("click", () => selectCell(i));
  }
  board.appendChild(cell);
}

function togglePencil() {
  pencilMode = !pencilMode;
  const btn = document.getElementById("pencil-btn");
  btn.classList.toggle("active", pencilMode);
  btn.innerText = pencilMode ? "✏️ Matita: ON" : "✏️ Matita: OFF";
  document.querySelectorAll(".num-key").forEach(k => k.classList.toggle("pencil-mode", pencilMode));
}

function selectCell(idx) {
  if (puzzleData.puzzle[idx] !== "0") return;
  selectedIdx = idx;

  const selRow = Math.floor(idx / 9);
  const selCol = idx % 9;
  const selBox = Math.floor(selRow / 3) * 3 + Math.floor(selCol / 3);

  document.querySelectorAll(".cell").forEach((c, i) => {
    const r = Math.floor(i / 9);
    const col = i % 9;
    const box = Math.floor(r / 3) * 3 + Math.floor(col / 3);
    c.classList.toggle("selected", i === idx);
    c.classList.toggle("related", i !== idx && !c.classList.contains("fixed") && (r === selRow || col === selCol || box === selBox));
  });
}

function renderCell(idx) {
  const cell = document.querySelectorAll(".cell")[idx];
  if (userValues[idx] !== "") {
    cell.innerHTML = userValues[idx];
  } else if (cellNotes[idx].size > 0) {
    let html = '<div class="notes-grid">';
    for (let n = 1; n <= 9; n++) {
      html += `<div class="note-num">${cellNotes[idx].has(String(n)) ? n : ""}</div>`;
    }
    html += '</div>';
    cell.innerHTML = html;
  } else {
    cell.innerHTML = "";
  }
}

function insertDigit(digit) {
  if (selectedIdx === -1) return;
  const d = digit ? String(digit) : "";

  if (d === "") {
    // Cancella valore e eventuali appunti della casella
    userValues[selectedIdx] = "";
    cellNotes[selectedIdx].clear();
  } else if (pencilMode) {
    // In modalità matita: se c'era un numero definitivo lo svuota e gestisce l'appunto
    userValues[selectedIdx] = "";
    if (cellNotes[selectedIdx].has(d)) {
      cellNotes[selectedIdx].delete(d);
    } else {
      cellNotes[selectedIdx].add(d);
    }
  } else {
    // Inserimento definitivo: sovrascrive le note
    userValues[selectedIdx] = d;
    cellNotes[selectedIdx].clear();
  }
  renderCell(selectedIdx);
}

// Supporto tastiera fisica PC (tasto M per attivare/disattivare matita)
document.addEventListener("keydown", (e) => {
  if (e.key.toLowerCase() === "m") {
    togglePencil();
    return;
  }
  if (selectedIdx === -1) return;
  if (e.key >= "1" && e.key <= "9") insertDigit(e.key);
  if (e.key === "Backspace" || e.key === "Delete") insertDigit("");
});

// Timer
let seconds = 0;
const timerDisplay = document.getElementById("timer");
const interval = setInterval(() => {
  seconds++;
  const m = String(Math.floor(seconds / 60)).padStart(2, '0');
  const s = String(seconds % 60).padStart(2, '0');
  timerDisplay.innerText = `${m}:${s}`;
}, 1000);

// Verifica e invio dati
function checkWin() {
  const currentStr = userValues.join("");
  if (currentStr.length < 81 || userValues.includes("")) {
    alert("Ci sono caselle ancora vuote!");
    return;
  }

  if (currentStr !== puzzleData.sol) {
    alert("Ci sono uno o più numeri errati nella griglia. Ricontrolla!");
    return;
  }

  clearInterval(interval);
  document.getElementById("submit-btn").disabled = true;
  document.getElementById("msg").style.color = "#2563eb";
  document.getElementById("msg").innerText = "Registrazione del tempo in corso...";

  fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      nome: nome,
      cognome: cognome,
      squadra: squadra,
      tempo: seconds
    })
  }).then(() => {
    document.getElementById("msg").style.color = "#16a34a";
    document.getElementById("msg").innerText = `Fatto! Tempo registrato: ${seconds} secondi. Puoi chiudere la finestra.`;
  }).catch(() => {
    document.getElementById("msg").style.color = "#dc2626";
    document.getElementById("msg").innerText = "Errore di connessione. Fai uno screenshot del timer!";
  });
}
</script>
</body>
</html>
